server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;

  # Service worker + manifest must never be served stale.
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* \.pdf$ {
    add_header Content-Type application/pdf;
    add_header Content-Disposition inline;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
